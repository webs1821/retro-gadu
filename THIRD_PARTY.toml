project = "libgadu protocol documentation"
upstream_url = "https://libgadu.github.io/protocol/"
kind = "reference-only"
upstream_authors = ["Autorzy dokumentacji libgadu"]
local_paths = ["crates/rgg-protocol/src/frame.rs", "crates/rgg-protocol/src/gg6.rs", "crates/rgg-protocol/src/gg6_messages.rs", "crates/rgg-protocol/src/gg6_presence.rs", "crates/rgg-protocol/src/gg6_directory.rs", "crates/rgg-http/src/legacy.rs", "docs/implementation/HTTP-DISCOVERY.md", "tests/gg6_sessions.py", "tests/gg6_conferences.py", "docs/implementation/CONFERENCES.md", "crates/rgg-protocol/src/gg6_images.rs", "docs/implementation/IMAGES.md", "tests/gg6_images.py"]
symbols = ["decode", "decode_login", "decode_message", "received", "Client"]
changes = "Wykorzystano opis formatu binarnego: nagłówki, LOGIN60, Windows-1250, ping/pong, listy NOTIFY i flagi kontaktów, statusy, SEND/RECV_MSG, ACK, podstawowe style tekstu oraz listy pozostałych uczestników konferencji (0x01) i rozsyłanie osobnych kopii przez klienta. W dev.10: deskryptory richtext 09 01, sterowanie obrazkami 04/05/06, CP1250 NBSP, limit 1909 B opcji i CRC32. Adapter Rust i klient testowy Python napisano niezależnie; test Python importuje jawnie przypisany port GG32. Nie skopiowano implementacji C ani tekstu dokumentacji."
verification = "Własny parser i jawne fixture bajtowe; dokumentacja nie zastępuje testów GG 6.0/6.1."
reviewed_on = "2026-11-01"

