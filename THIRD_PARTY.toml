[[sources]]
id = "gg-retro-compatibility-reference"
project = "gg-retro fork webs1821"
upstream_url = "https://github.com/webs1821/gg-retro"
commit = "ed9640cc247764754b5e47891053eb07a53f76d5"
kind = "reference-only"
upstream_authors = ["macbury", "webs1821"]
license_ref = "LicenseRef-MIS-macbury"
local_paths = ["docs/implementation/PARITY.md", "PLAN_IMPLEMENTACJI.md", "docs/implementation/PUBLIC-DIRECTORY.md", "crates/rgg-protocol/src/gg6_directory.rs", "tools/inspect_gg_retro.py", "tests/legacy_inspection.py", "docs/implementation/gg-retro-schema-reference.json", "docs/implementation/IMPORT-GG-RETRO.md", "crates/rgg-credentials/src/lib.rs", "crates/rgg-store-sqlite/migrations/0009_legacy_invitations.sql", "tests/legacy_invitations.py", "docs/implementation/LEGACY-INVITATIONS.md", "tools/migrate_gg_retro.py", "tests/legacy_import.py", "crates/rgg-credentials/src/gg_retro.rs", "crates/rgg-admin/src/import/validate.rs", "crates/rgg-store-sqlite/src/import_data.rs", "tools/client_patch.py", "tools/build_client.py", "tests/client_package.py", "docs/implementation/CLIENT-PACKAGES.md", "tools/client_plan.py", "crates/rgg-http/src/client-patcher-core.mjs", "crates/rgg-http/src/client-patch-plan.json", "tests/client_browser.py", "docs/implementation/BROWSER-PATCHER.md", "docs/implementation/CLIENT-UPLOAD.md", "tests/client_upload_wire.py"]
symbols = ["0.8.3"]
changes = "Punkt odniesienia zakresu funkcjonalnego i obserwacji kompatybilności. Inspekcja przed importem używa faktów schematu (kolumny i sumy 11 migracji), formatów ggv1 i hashy zaproszeń; referencja JSON nie zawiera kopii SQL. Testy tworzą własne dane z tych faktów. Importer dev.15 niezależnie odczytuje ggv1/AAD, konwertuje CP1250 i opcje GG6, zachowuje zaproszenia, numery i stan danych w transakcji rGG. Kod serwera, migracje i testy upstream nie zostały skopiowane. Licencja upstream jest niestandardowa (MIS), nie MIT. Dev.17 wykorzystuje sprawdzone fakty formatu konkretnego GG6.1: hash, offsety, ABI aktualizatora i nazwy dźwięków. Parser PE/NSIS, przebudowa RT_STRING i generator są niezależną implementacją; nie skopiowano tools/build_client.py, patch_client.cjs ani patcher.js. Dev.20 przenosi własną receptę rGG do niezależnego modułu ES; JSON zawiera wyłącznie fakty zakresów i minimalne stałe sekwencje ABI, bez klienta lub tablic tekstowych. Wynik JS/Python porównano bajtowo dla trzech adresów i pobrano w przeglądarce. Klient binarny ma własne warunki i pozostaje poza repo. Dev.25: własna82-bajtowa poprawka uploadu GG6.1 na podstawie obserwacji ABI: pełne2047B nie kończy archiwum; dodano jeden pusty MORE i aktualizację licznika odpowiedzi, bez kopii oryginalnej funkcji. Samodzielny emulator CPU sprawdza79 przypadków, a osiem przechwyconych sekwencji odtworzono przezTCP. Każdy przyszły port wymaga osobnego wpisu i zachowania oryginalnej licencji."
verification = "Lokalny przegląd przypiętej wersji forka; lista braków w macierzy zgodności. Własne testy inspekcji schematu i zgodności hashy zaproszeń, w tym zachowanie zużycia i aktywności przez WWW/CLI/restore."
reviewed_on = "2026-11-01"

