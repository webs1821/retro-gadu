name: local-development-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - run: python tools/verify_repository.py
      - run: python tools/gg32_vectors.py
      - run: python tests/legacy_inspection.py
      - run: python tests/client_package.py
      - run: node --version
      - run: python tests/client_browser.py
      - run: python tests/container_context.py
      - run: cargo metadata --locked --format-version 1 | python tools/dependency_inventory.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python tests/lifecycle.py --binary target/debug/rgg-server
      - run: python tests/accounts_cli.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/backups_cli.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/keys_cli.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/password_cli.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/gg6_sessions.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/gg6_presence_contacts.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/gg6_directory.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/http_discovery.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/http_registration.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/http_password.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/legacy_invitations.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/legacy_import.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/http_statistics.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/http_downloads.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/http_patcher.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/http_limits.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/http_metrics.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/runtime_metrics.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/r0_smoke.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/gg6_conferences.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: python tests/gg6_images.py --admin target/debug/rgg-admin --server target/debug/rgg-server
      - run: cargo build --workspace --locked --features rgg-server/test-hooks
      - run: python tests/http_password.py --admin target/debug/rgg-admin --server target/debug/rgg-server --faults
      - run: python tests/gg6_sessions.py --admin target/debug/rgg-admin --server target/debug/rgg-server --faults
      - run: python tests/gg6_presence_contacts.py --admin target/debug/rgg-admin --server target/debug/rgg-server --faults
      - run: python tests/gg6_conferences.py --admin target/debug/rgg-admin --server target/debug/rgg-server --faults
      - run: python tests/gg6_images.py --admin target/debug/rgg-admin --server target/debug/rgg-server --faults
      - run: cargo build --workspace --locked --features rgg-admin/test-hooks
      - run: python tests/backups_cli.py --admin target/debug/rgg-admin --server target/debug/rgg-server --faults
      - run: python tests/keys_cli.py --admin target/debug/rgg-admin --server target/debug/rgg-server --faults
      - run: python tests/legacy_import.py --admin target/debug/rgg-admin --server target/debug/rgg-server --faults
      - run: python tests/password_cli.py --admin target/debug/rgg-admin --server target/debug/rgg-server --faults
      - run: cargo build --workspace --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
