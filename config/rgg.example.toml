# Local development only. Paths are resolved relative to this file.
data_dir = "../data"
http_bind = "127.0.0.1:8088"
# metrics_bind = "127.0.0.1:9090" # Optional private operator endpoint; separate loopback port.
shutdown_seconds = 5

# Enable only after initializing this data directory and creating local accounts.
# In WSL, use a Linux filesystem path for data_dir and keys.toml (see README).
# gg_bind = "127.0.0.1:8074"
# legacy_discovery = true # Requires gg_bind with a loopback IPv4 address.
# web_registration = true # Local /register; requires gg_bind and an initialized keyring.
# web_public_stats = true # Local / and /api/stats; counts only publicly visible presence.
# downloads_manifest = 'downloads/manifest.toml' # Optional verified client/installer artifacts.

# Defaults, shown explicitly for local protocol testing:
[http]
max_connections = 64
per_ip = 16
idle_seconds = 15 # No bytes read or written; active downloads may last longer.
write_seconds = 10 # A blocked TCP write cannot be extended by incoming bytes.
lifetime_seconds = 600 # Absolute lifetime, including keep-alive and trickled headers.

[network]
max_connections = 64
per_ip = 16
login_seconds = 5
initial_seconds = 5
idle_seconds = 90
write_millis = 2000
archive_seconds = 10

[queue]
per_recipient_messages = 1000
per_sender_messages = 1000
global_messages = 10000
per_recipient_bytes = 4194304
global_bytes = 33554432
ttl_seconds = 2592000
