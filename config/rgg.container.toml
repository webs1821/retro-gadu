# Isolated local container profile. No external listener or published ports.
data_dir = "/data"
http_bind = "127.0.0.1:8088"
gg_bind = "127.0.0.1:8074"
legacy_discovery = true
web_registration = true
web_public_stats = true
shutdown_seconds = 5

[http]
max_connections = 64
per_ip = 16
idle_seconds = 15
write_seconds = 10
lifetime_seconds = 600

# Experimental R0 capacity; qualification is separate from these ceilings.
[network]
max_connections = 128
per_ip = 128
login_seconds = 5
initial_seconds = 5
idle_seconds = 90
write_millis = 2000
archive_seconds = 10

[queue]
per_recipient_messages = 1000
per_sender_messages = 1000
global_messages = 10000
per_recipient_bytes = 4194304
global_bytes = 33554432
ttl_seconds = 2592000
